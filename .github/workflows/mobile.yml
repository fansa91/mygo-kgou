# Builds the phone apps on a tag, next to the desktop release, and keeps
# their artifacts on the release. iOS is built for the simulator: no
# developer team or provisioning profile is needed, so the build cannot
# sign an .ipa and does not try. Android is signed with the upload key
# decoded from the repository's secrets.
name: Mobile

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # upload the phones' artifacts to the release of the tag

env:
  RELEASE_REPO: fansa91/mygo-kgou

jobs:
  ios:
    name: iOS simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          jq --arg v "$v" '.version = $v' mygo.json > mygo.json.tmp && mv mygo.json.tmp mygo.json
      # A simulator build is ad hoc signed by the toolchain, with no team,
      # profile or certificate. It runs in Simulator and cannot go to the
      # App Store; that would need a signed .ipa and a developer account.
      - name: Build for the iOS simulator
        run: go tool mygo build -platform ios/simulator
      - name: Pack the simulator app
        run: |
          version="$(jq -r .version mygo.json)"
          cd build/ios-simulator
          zip -qr "../../mygo-kgou-${version}-ios-simulator.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: build/ios-simulator
          if-no-files-found: error
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version mygo.json)"
          gh release upload "$GITHUB_REF_NAME" "mygo-kgou-${version}-ios-simulator.zip" \
            --repo "$RELEASE_REPO" --clobber

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      # ubuntu-latest ships the Android SDK and an NDK already. mygo finds
      # both here on its own; setup-android breaks on the runner's current
      # cmdline-tools (it tries to install the retired "tools" package), so
      # use what is preinstalled instead.
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          jq --arg v "$v" '.version = $v' mygo.json > mygo.json.tmp && mv mygo.json.tmp mygo.json
      # The keystore is a secret: decode it outside the repository, point
      # mygo.json at it, and give mygo the two passwords it asks for. A
      # build with no secret still runs, signed with the debug key, which
      # is useful for manual runs but is not accepted by Google Play.
      - name: Set up the upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 not set; building with the debug key."
            exit 0
          fi
          keystore="$RUNNER_TEMP/upload.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          alias="${ANDROID_KEY_ALIAS:-upload}"
          jq --arg f "$keystore" --arg a "$alias" \
            '.android.keystore = $f | .android.keyAlias = $a' mygo.json > mygo.json.tmp
          mv mygo.json.tmp mygo.json
          echo "MYGO_ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MYGO_ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build for Android
        run: go tool mygo build -platform android
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            build/android/*.apk
            build/android/*.aab
          if-no-files-found: error
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version mygo.json)"
          gh release upload "$GITHUB_REF_NAME" build/android/mygo-kgou-"${version}".apk \
            build/android/mygo-kgou-"${version}".aab --repo "$RELEASE_REPO" --clobber
