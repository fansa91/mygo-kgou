# Builds the phone apps on a tag, next to the desktop release, and keeps
# their artifacts on the release. iOS is a signed, installable .ipa when the
# signing secrets are set; without them it falls back to a simulator .app.
# Android is signed with the upload key decoded from the repository's secrets.
name: Mobile

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # upload the phones' artifacts to the release of the tag

env:
  RELEASE_REPO: fansa91/mygo-kgou

jobs:
  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          jq --arg v "$v" '.version = $v' mygo.json > mygo.json.tmp && mv mygo.json.tmp mygo.json

      # A device .ipa needs a certificate in a keychain and a provisioning
      # profile for the app's identifier. Decode both from secrets when they
      # are set and point ios at them; mygo picks the identity and profile
      # that match. Without the secrets, fall back to a simulator .app.
      - name: Import the signing certificate and profile
        id: sign
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DISTRIBUTION: ${{ secrets.IOS_DISTRIBUTION }}
        run: |
          if [ -z "$IOS_CERTIFICATE_P12" ] || [ -z "$IOS_PROVISIONING_PROFILE" ]; then
            echo "iOS signing secrets not set; building for the simulator."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/ios-signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$IOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          profile="$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$profile"
          jq --arg p "$profile" --arg t "$IOS_TEAM_ID" --arg d "$IOS_DISTRIBUTION" \
            '.ios.provisioningProfile = $p
             | if $t != "" then .ios.team = $t else . end
             | if $d != "" then .ios.distribution = $d else . end' \
            mygo.json > mygo.json.tmp && mv mygo.json.tmp mygo.json
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the signed .ipa
        if: steps.sign.outputs.signed == 'true'
        run: go tool mygo build -platform ios

      - name: Build for the iOS simulator
        if: steps.sign.outputs.signed != 'true'
        run: go tool mygo build -platform ios/simulator

      - name: Pack the iOS app
        run: |
          version="$(jq -r .version mygo.json)"
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            name="mygo-kgou-${version}-ios.ipa"
            cp build/ios-arm64/*.ipa "$name"
          else
            name="mygo-kgou-${version}-ios-simulator.zip"
            (cd build/ios-simulator && zip -qr "../../$name" .)
          fi
          echo "IOS_ASSET=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: build/ios-*
          if-no-files-found: error
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$IOS_ASSET" --repo "$RELEASE_REPO" --clobber

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      # ubuntu-latest ships the Android SDK and an NDK already. mygo finds
      # both here on its own; setup-android breaks on the runner's current
      # cmdline-tools (it tries to install the retired "tools" package), so
      # use what is preinstalled instead.
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          jq --arg v "$v" '.version = $v' mygo.json > mygo.json.tmp && mv mygo.json.tmp mygo.json
      # The keystore is a secret: decode it outside the repository, point
      # mygo.json at it, and give mygo the two passwords it asks for. A
      # build with no secret still runs, signed with the debug key, which
      # is useful for manual runs but is not accepted by Google Play.
      - name: Set up the upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 not set; building with the debug key."
            exit 0
          fi
          keystore="$RUNNER_TEMP/upload.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          alias="${ANDROID_KEY_ALIAS:-upload}"
          jq --arg f "$keystore" --arg a "$alias" \
            '.android.keystore = $f | .android.keyAlias = $a' mygo.json > mygo.json.tmp
          mv mygo.json.tmp mygo.json
          echo "MYGO_ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MYGO_ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build for Android
        run: go tool mygo build -platform android
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            build/android/*.apk
            build/android/*.aab
          if-no-files-found: error
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version mygo.json)"
          gh release upload "$GITHUB_REF_NAME" build/android/mygo-kgou-"${version}".apk \
            build/android/mygo-kgou-"${version}".aab --repo "$RELEASE_REPO" --clobber
