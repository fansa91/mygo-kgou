# Pushing a tag such as v0.1.0 builds the apps of macOS, Windows and Linux,
# signs them and their updates when the secrets are set, uploads them to a draft
# release of the tag, and then publishes that release so installed apps update to
# it. The version of every build comes from the tag itself.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release, the uploads to it, and publishing it

# The repo the release (and the in-app auto-updates) land in.
env:
  RELEASE_REPO: fansa91/mygo-kgou

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The build jobs read the version from mygo.json, which the tag sets,
      # so every artifact carries the version the tag names.
      - name: Set the version from the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          jq --arg v "$v" '.version = $v' mygo.json > mygo.json.tmp && mv mygo.json.tmp mygo.json
      # The tag and mygo.json must agree on the version.
      - name: Check the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      # mygo build puts the version's section of CHANGELOG.md in the update
      # manifests, which the update window shows; the release page gets the
      # same notes, in place of GitHub's from the pull requests.
      - name: Take the notes from the changelog
        run: |
          awk -v heading="## ${GITHUB_REF_NAME#v}" '
            /^## / { inside = ($0 == heading); next }
            inside
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || echo "Released $GITHUB_REF_NAME." > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      # Make sure the release targets fansa91/mygo-kgou, the repo the app's
      # auto-updater also points to.
      - name: Check the release repo matches mygo.json
        run: test "$RELEASE_REPO" = "$(jq -r .updates.github mygo.json)"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$RELEASE_REPO" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$RELEASE_REPO" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The version of this build is the tag, written into mygo.json.
      - name: Set the version from the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          jq --arg v "$v" '.version = $v' mygo.json > mygo.json.tmp && mv mygo.json.tmp mygo.json
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      # The certificate signs the app; the notary profile, in mygo.json,
      # notarizes its disk image. Both go in a keychain of the job, made the
      # default one, where codesign and notarytool look. Run this only on
      # macOS; when the MACOS_CERTIFICATE secret is absent, the build stays
      # unsigned and the step exits cleanly.
      - name: Import the certificate and the notary credentials
        if: matrix.name == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "MACOS_CERTIFICATE secret not set; skipping macOS signing."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          security default-keychain -d user -s "$keychain"
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      # mygo reads updates.github (fansa91/mygo-kgou) to know where to upload,
      # and uses GH_TOKEN to do it; the upload goes to the draft release made
      # by the draft-release job. MYGO_UPDATER_PRIVATE_KEY signs the update
      # archives when set.
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$RELEASE_REPO" --draft=false
          gh release view "$GITHUB_REF_NAME" --repo "$RELEASE_REPO" --json tagName,isDraft,url
